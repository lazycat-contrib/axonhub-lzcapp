version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: axonhub

build:
  run_buildscript: false

images:
  - id: axonhub
    target: service
    service: axonhub
    source: docker.io/looplj/axonhub
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    application:
      language: zh
      name: AxonHub
      source: https://github.com/looplj/axonhub
      source_author: looplj
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: AxonHub
    summary: Stable releases published from GitHub Actions
